name: Deploy

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: penny-deploy
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.6"
      - run: ./scripts/uv sync --locked
      - run: ./scripts/uv run --locked ruff check penny tests
      - run: ./scripts/uv run --locked python -m unittest discover -s tests

  deploy:
    needs: test
    if: >-
      ${{
        always() && ((github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'master') ||
        (github.event_name == 'workflow_dispatch' && needs.test.result == 'success'))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/penny" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ env.SOURCE_SHA }}
            ${{ steps.image.outputs.name }}:latest

      - uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4
        with:
          version: latest

      - uses: Azure/k8s-set-context@4334b489abaae3336d9b19d15d53ad72412ec412 # v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      # The kubeconfig points at 127.0.0.1:6443; an SSH tunnel carries it to
      # the API.
      - name: Deploy to Kubernetes
        env:
          CI_DEPLOY_SSH_KEY: ${{ secrets.CI_DEPLOY_SSH_KEY }}
          K3S_HOST: ${{ secrets.K3S_HOST }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_USER_IDS: ${{ secrets.ALLOWED_USER_IDS }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          MODEL_NAME: ${{ vars.MODEL_NAME || 'deepseek-flash' }}
          MODEL_BASE_URL: ${{ vars.MODEL_BASE_URL || 'https://api.deepseek.com' }}
          STORE_PROXY: ${{ vars.STORE_PROXY }}
          TELEGRAM_PROXY: ${{ vars.TELEGRAM_PROXY }}
          PENNY_LOG_LEVEL: ${{ vars.PENNY_LOG_LEVEL || 'INFO' }}
          PENNY_LOG_CONTENT: ${{ vars.PENNY_LOG_CONTENT || '0' }}
          PENNY_NODE_SELECTOR: ${{ vars.PENNY_NODE_SELECTOR }}
          PENNY_TOLERATION: ${{ vars.PENNY_TOLERATION }}
          PENNY_STORES_CONFIG_JSON: ${{ secrets.PENNY_STORES_CONFIG_JSON }}
          IMAGE: ${{ steps.image.outputs.name }}:${{ env.SOURCE_SHA }}
        run: |
          set -euo pipefail
          umask 077
          for name in CI_DEPLOY_SSH_KEY K3S_HOST TELEGRAM_BOT_TOKEN \
            ALLOWED_USER_IDS MODEL_API_KEY PENNY_STORES_CONFIG_JSON; do
            if test -z "${!name}"; then
              echo "Missing production secret: $name" >&2
              exit 1
            fi
          done
          if test -z "$STORE_PROXY"; then
            echo "Missing production variable: STORE_PROXY" >&2
            exit 1
          fi
          # Placement is cluster-specific and is rendered into the manifest below.
          if test -z "$PENNY_NODE_SELECTOR" ||
             test "${PENNY_NODE_SELECTOR#*=}" = "$PENNY_NODE_SELECTOR"; then
            echo "Missing or malformed production variable: PENNY_NODE_SELECTOR (key=value)" >&2
            exit 1
          fi
          printf '%s' "$PENNY_STORES_CONFIG_JSON" > "$RUNNER_TEMP/stores.local.json"
          python3 -m json.tool "$RUNNER_TEMP/stores.local.json" > /dev/null
          echo "$CI_DEPLOY_SSH_KEY" > /tmp/ci_deploy_key
          chmod 600 /tmp/ci_deploy_key
          ssh -o StrictHostKeyChecking=accept-new -i /tmp/ci_deploy_key \
            -L 6443:127.0.0.1:6443 -N "ci-deploy@$K3S_HOST" &
          SSH_PID=$!
          trap 'kill $SSH_PID 2>/dev/null || true' EXIT
          sleep 2

          kubectl create namespace penny --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n penny create secret generic penny-env \
            --from-literal=TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" \
            --from-literal=ALLOWED_USER_IDS="$ALLOWED_USER_IDS" \
            --from-literal=MODEL_API_KEY="$MODEL_API_KEY" \
            --from-literal=MODEL_NAME="$MODEL_NAME" \
            --from-literal=MODEL_BASE_URL="$MODEL_BASE_URL" \
            --from-literal=STORE_PROXY="$STORE_PROXY" \
            --from-literal=TELEGRAM_PROXY="$TELEGRAM_PROXY" \
            --from-literal=PENNY_LOG_LEVEL="$PENNY_LOG_LEVEL" \
            --from-literal=PENNY_LOG_CONTENT="$PENNY_LOG_CONTENT" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n penny create secret generic penny-stores \
            --from-file=stores.local.json="$RUNNER_TEMP/stores.local.json" \
            --dry-run=client -o yaml | kubectl apply -f -

          # Placement stays out of the manifest: render the node selector and, when the
          # node is reserved for Penny, the matching toleration.
          if ! grep -q 'nodeSelector: {}' deploy/k8s/penny.yaml ||
             ! grep -q 'tolerations: \[\]' deploy/k8s/penny.yaml; then
            echo "deploy/k8s/penny.yaml lost the placement placeholders" >&2
            exit 1
          fi
          node_key="${PENNY_NODE_SELECTOR%%=*}"
          node_value="${PENNY_NODE_SELECTOR#*=}"
          placement=(-e "s|nodeSelector: {}|nodeSelector: {$node_key: $node_value}|")
          if test -n "$PENNY_TOLERATION"; then
            IFS='=:' read -r taint_key taint_value taint_effect <<< "$PENNY_TOLERATION"
            if test -z "$taint_effect"; then
              echo "Malformed production variable: PENNY_TOLERATION (key=value:effect)" >&2
              exit 1
            fi
            toleration="{key: $taint_key, operator: Equal, value: $taint_value, effect: $taint_effect}"
            placement+=(-e "s|tolerations: \[\]|tolerations: [$toleration]|")
          fi
          sed -e "s|image: penny:latest|image: $IMAGE|" "${placement[@]}" \
            deploy/k8s/penny.yaml | kubectl apply -f -
          kubectl -n penny rollout restart deployment/penny
          kubectl -n penny rollout status deployment/penny --timeout=300s
