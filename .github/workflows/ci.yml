name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.6"
      - run: ./scripts/uv sync --locked
      - run: ./scripts/uv run --locked ruff check penny tests
      - run: ./scripts/uv run --locked python -m unittest discover -s tests -v
      - run: ./scripts/uv run --locked python -c "from penny.bot import main; from curl_cffi import requests"
