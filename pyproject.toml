[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "penny-family"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["aiogram>=3.20,<4", "curl-cffi>=0.11,<1", "httpx>=0.28,<1",
                "python-dotenv>=1,<2", "camoufox[geoip]>=0.5,<1"]

[project.scripts]
penny = "penny.bot:main"

[tool.setuptools.packages.find]
include = ["penny*"]

[tool.uv]
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
