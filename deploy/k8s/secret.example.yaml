# Example only — the GitHub Actions workflow creates this Secret from the
# `production` environment secrets. Use this file for a manual deploy:
#   kubectl -n penny create secret generic penny-env --from-env-file=.env
apiVersion: v1
kind: Secret
metadata:
  name: penny-env
  namespace: penny
type: Opaque
stringData:
  TELEGRAM_BOT_TOKEN: "REPLACE"
  ALLOWED_USER_IDS: "123456789,987654321"
  DEEPSEEK_API_KEY: "REPLACE"
  DEEPSEEK_MODEL: "deepseek-flash"
  # SOCKS5 proxy for store requests, reachable from the node that runs the pod.
  # socks5h:// resolves store hostnames at the proxy, not in the cluster.
  STORE_PROXY: "socks5h://192.168.1.1:10807"
  # Optional: SOCKS5 proxy for Bot API calls, where api.telegram.org is filtered.
  TELEGRAM_PROXY: "socks5://192.168.1.1:10808"
  PENNY_LOG_LEVEL: "INFO"
  PENNY_LOG_CONTENT: "0"
  PENNY_STORE_DEADLINE: "30"
  PENNY_WATCH_INTERVAL: "10800"
  PENNY_WATCH_START_DELAY: "300"
  PENNY_WATCH_LIMIT: "20"
